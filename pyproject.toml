[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "netwatch"
dynamic = ["version"]
description = "Local per-process network behavior anomaly detection"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Void1-1" }]
keywords = ["anomaly-detection", "network-security", "privacy", "psutil"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "psutil>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
netwatch = "netwatch.cli:app"

[tool.hatch.version]
path = "src/netwatch/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/netwatch"]

# The documented example config lives at the repo root and is shipped inside the wheel so `netwatch init` can copy it after a regular, non-editable install
[tool.hatch.build.targets.wheel.force-include]
"config.example.yaml" = "netwatch/config.example.yaml"

[tool.hatch.build.targets.sdist]
include = [
    "src/netwatch",
    "tests",
    "scripts",
    "docs",
    "config.example.yaml",
    "README.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
